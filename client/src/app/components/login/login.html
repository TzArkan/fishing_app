<div class="login-wrapper">
  <div class="login-card">
    
    <div class="header">
      <div class="fish-tank">
        <div class="gold-fish">
          <div class="fish-eye"></div>
          <div class="fish-fin"></div>
          <div class="fish-tail"></div>
        </div>
      </div>
      <h2>Bine ai venit!</h2>
      <p>Loghează-te pentru a-ți vedea capturile</p>
    </div>

    <div class="error-toast" *ngIf="errorMessage">
      ⚠️ {{ errorMessage }}
    </div>

    <div *ngIf="step === 1" class="step-container fadeIn">
      <div class="form-group">
        <label>Email</label>
        <input 
          type="email" 
          class="modern-input" 
          [(ngModel)]="email" 
          (keyup.enter)="verifyEmail()" 
          placeholder="email@exemplu.ro"
        >
      </div>
      <button class="btn-nature" (click)="verifyEmail()">Continuă</button>
    </div>

    <div *ngIf="step === 2" class="step-container fadeIn">
      
      <div class="user-badge">
        <span class="user-email">{{ email }}</span>
        <button class="btn-change" (click)="goBack()">Schimbă</button>
      </div>

      <div class="form-group">
        <label>Parolă</label>
        <input 
          type="password" 
          class="modern-input" 
          [(ngModel)]="password" 
          (keyup.enter)="onLogin()" 
          placeholder="••••••"
        >
      </div>
      <button class="btn-nature" (click)="onLogin()">Intră în cont</button>
    </div>

    <div class="footer-link">
      Nu ai cont? <a routerLink="/register">Înregistrează-te</a>
    </div>
    
    <div style="margin-top: 10px; text-align: center;">
      <a routerLink="/resetare-parola" style="color: #7f8c8d; font-size: 0.9em; text-decoration: none;">Am uitat parola?</a>
    </div>

  </div>
</div>
