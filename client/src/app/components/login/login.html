<div class="login-wrapper">
  <div class="login-card">
    
    <div class="header">
      <div class="icon-circle">🎣</div>
      <h2>Bine ai venit!</h2>
      <p>Loghează-te pentru a-ți vedea capturile</p>
    </div>

    <div class="form-group">
      <label>Email</label>
      <input 
        type="email" 
        class="modern-input" 
        [(ngModel)]="email" 
        (keyup.enter)="onLogin()" 
        placeholder="email@exemplu.ro"
      >
    </div>

    <div class="form-group">
      <label>Parolă</label>
      <input 
        type="password" 
        class="modern-input" 
        [(ngModel)]="password" 
        (keyup.enter)="onLogin()" 
        placeholder="••••••"
      >
    </div>

    <button class="btn-nature" (click)="onLogin()">Intră în cont</button>

    <div class="footer-link">
      Nu ai cont? <a routerLink="/register">Înregistrează-te</a>
    </div>
    
    <div style="margin-top: 10px; text-align: center;">
    <a routerLink="/resetare-parola" style="color: #7f8c8d; font-size: 0.9em;">Am uitat parola?</a>
</div>
  </div>
</div>
