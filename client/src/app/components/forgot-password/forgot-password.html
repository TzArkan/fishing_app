<div class="page-wrapper">
  <div class="glass-card">
    <h2>🔐 Resetare Parolă</h2>

    <div *ngIf="step === 1">
      <p style="text-align: center; color: #666; margin-bottom: 20px;">
        Ai uitat parola? Introdu emailul și îți trimitem un cod.
      </p>
      
      <div class="form-group">
        <label>Email</label>
        <input [(ngModel)]="email" class="form-control" type="email" placeholder="exemplu@email.com">
      </div>

      <button class="btn-save" (click)="sendCode()" [disabled]="loading || !email">
        {{ loading ? 'Se trimite...' : 'Trimite Cod' }}
      </button>
    </div>

    <div *ngIf="step === 2">
      <div class="success-msg">{{ message }}</div>
      
      <div class="form-group">
        <label>Cod primit pe email</label>
        <input [(ngModel)]="code" class="form-control" type="text" placeholder="Ex: 123456" maxlength="6">
      </div>

      <div class="form-group">
        <label>Parolă nouă</label>
        <input [(ngModel)]="newPassword" class="form-control" type="password" placeholder="******">
      </div>

      <button class="btn-save" (click)="resetPassword()" [disabled]="loading">
        {{ loading ? 'Se procesează...' : 'Schimbă Parola' }}
      </button>
    </div>

    <p class="error-msg" *ngIf="error">{{ error }}</p>

    <div class="links">
      <a routerLink="/login">← Înapoi la Login</a>
    </div>
  </div>
</div>
