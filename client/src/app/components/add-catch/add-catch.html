<div class="page-wrapper">
  <div class="glass-card">
    <div class="add-catch-container">
      <h2>Adaugă o Captură Nouă</h2>

      <div class="form-group photo-section">
        <label>Fotografia Capturii (obligatoriu):</label>
        
        <div class="photo-upload-zone" [ngClass]="{'has-image': imagePreview}">
          
          <div *ngIf="imagePreview" class="photo-preview">
             <img [src]="imagePreview" alt="Previzualizare captura">
             <button type="button" class="btn-remove-photo" (click)="removePhoto()">×</button>
          </div>

          <label *ngIf="!imagePreview" for="photoInput" class="upload-placeholder">
              <span class="icon">📷</span>
              <span class="text">Apasă sau trage poza aici</span>
              <small>format JPG, PNG (max 10MB)</small>
          </label>
          
          <input id="photoInput" type="file" (change)="onFileSelected($event)" accept="image/*" class="hidden-input">
        </div>

        <button type="button" class="btn-ai" (click)="identificaPoza()" *ngIf="selectedFile && !aiConfidence" [disabled]="isPredicting">
          <span *ngIf="!isPredicting">✨ Identifică peștele cu AI</span>
          <span *ngIf="isPredicting">⏳ Se scanează imaginea...</span>
        </button>
      </div>

      <hr class="separator">

      <div class="form-group">
        <label>Specie:</label>
        <select [(ngModel)]="specie" class="form-control custom-select" [ngClass]="{'ai-highlight': aiConfidence}">
          <option value="" disabled selected>-- Alege Specia --</option>
          <option *ngFor="let peste of speciiLista" [value]="peste">
            {{ peste }}
          </option>
        </select>
        <small *ngIf="aiConfidence" class="ai-success-msg">
         AI a detectat specia cu acuratețe: {{ aiConfidence }}%
      </small>
      </div>

      <div class="form-group">
        <label>Lungime (cm):</label>
        <input 
        type="number" 
        [(ngModel)]="lungime" 
        placeholder="0 cm" 
        min="0" 
        oninput="this.value = !!this.value && Math.abs(this.value) >= 0 ? Math.abs(this.value) : null"
        class="form-control">
      </div>

      <div class="form-group">
        <label>Locație & Zonă Detectată:</label>
        <div class="location-row">
            <span class="zona-badge" [ngClass]="zonaDetectata">
                {{ zonaNumeAfisat }}
            </span>
            
            <button type="button" (click)="openMapPicker()" class="btn-map">
                📍 Alege pe Hartă
            </button>
        </div>
      </div>

      <div class="form-group">
        <label>Detalii suplimentare:</label>
        <textarea [(ngModel)]="detalii" placeholder="Momeală, vreme, comportament etc" class="form-control" style="min-height: 80px;"></textarea>
      </div>

      <div class="form-group">
        <label>Data Capturii:</label>
        <input 
          type="date" 
          [(ngModel)]="dataCapturii" 
          class="form-control"
          [max]="maxDate"
          style="cursor: pointer;">
      </div>

      <button (click)="onSubmit()" class="btn-save">Salvează Captura</button>
    </div>
  </div>
</div>

<div class="modal-overlay" *ngIf="showMapModal">
    <div class="modal-content glass-modal">
        <h3>Alege Locația Exactă</h3>
        <div id="catch-map" class="map-container"></div>
        <div class="modal-actions">
            <button (click)="closeMapModal()" class="btn-cancel">Anulează</button>
            <button (click)="confirmLocation()" class="btn-confirm">Confirmă Locația</button>
        </div>
    </div>
</div>
