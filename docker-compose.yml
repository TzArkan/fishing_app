version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password 
      POSTGRES_DB: fishing_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  server:
    build: ./server
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASS=password
      - DB_NAME=postgres
    depends_on:
      - db
      - ai-service  # <--- AM ADĂUGAT DOAR ASTA (ca să vadă containerul de Python)
    volumes:
      - ./server:/app
      - /app/node_modules
      - ./server/uploads:/app/uploads
    restart: always

  client:
    build: ./client
    ports:
      - "4200:4200"
    depends_on:
      - server
    restart: always

  # --- SERVICIUL NOU (Adăugat pentru a rula modelul .h5) ---
  ai-service:
    build: ./ai_service
    ports:
      - "5001:5001"
    volumes:
      # Mapăm modelul din folderul tău în container
      - ./ai_service/model_pesti_final.h5:/app/model_pesti_final.h5
    restart: always

volumes:
  pgdata: